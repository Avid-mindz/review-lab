# i3547 merge-admission condition binding fixture (engagement-owned repo only)
pull_request_rules:
  - name: i3547 auto merge docs only
    conditions:
      - base = main
      - "title ~= ^i3547-auto"
      - "files ~= ^docs/"
      - "-files ~= ^src/security/"
    actions:
      merge:
        method: squash

queue_rules:
  - name: i3547-docs
    queue_conditions:
      - base = main
      - "title ~= ^i3547-docs"
      - "files ~= ^docs/"
    merge_conditions:
      - base = main
      - "check-success = cond-gate"
    batch_size: 1
    merge_method: squash
  - name: i3547-guard
    queue_conditions:
      - base = main
      - "title ~= ^i3547-guard"
      - "files ~= ^docs/"
      - "-files ~= ^src/security/"
    merge_conditions:
      - base = main
      - "check-success = cond-gate"
    batch_size: 1
    merge_method: squash
  - name: i3547-cmd
    queue_conditions:
      - base = main
      - "title ~= ^i3547-cmd"
      - "files ~= ^docs/"
    merge_conditions:
      - base = main
      - "check-success = cond-gate"
    batch_size: 1
    merge_method: squash

merge_queue:
  max_parallel_checks: 1
  mode: serial